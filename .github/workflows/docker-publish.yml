name: Docker Build and Publish

on:
  push:
    branches: [ "main", "master" ]
  # We also run it on pull requests to ensure the code *can* build, 
  # but we only push to Docker Hub on actual merges to main.
  pull_request:
    branches: [ "main", "master" ]

env:
  # Define image names
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sync-learn-frontend
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sync-learn-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Only log in if it's not a PR (we don't push PR builds)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/zoom_clone
          file: ./frontend/zoom_clone/Dockerfile
          # Push only if it's a merge/push to main
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.FRONTEND_IMAGE }}:latest,${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          # Use Docker registry caching to speed up subsequent GitHub Action builds
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max
